<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Open Waters - Drowned Isles</title>
  <desc id="desc">A vast dark ocean with a single small island and a runic marker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102d42"/>
      <stop offset="1" stop-color="#06131f"/>
    </linearGradient>
    <radialGradient id="sea" cx="45%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1d5f7d"/>
      <stop offset="0.55" stop-color="#123f5c"/>
      <stop offset="1" stop-color="#081d2d"/>
    </radialGradient>
    <clipPath id="mapClip">
      <circle cx="256" cy="262" r="196"/>
    </clipPath>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6b77a"/>
      <stop offset="1" stop-color="#9c7c4e"/>
    </linearGradient>
    <linearGradient id="moss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#81a85a"/>
      <stop offset="1" stop-color="#486b3d"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="44" fill="url(#bg)"/>
